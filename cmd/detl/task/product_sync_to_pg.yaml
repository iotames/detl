# ETL 转换任务：MySQL → Python → PG2 完整链路
kind: 转换
name: 商品数据同步到 PG2

source:
  connection: mysql8_local              # 源库：mysql8_local
  query_file: get_products.sql          # MySQL 抽取 SQL

transform:
  mode: python                          # Python 脚本转换
  script: t_product.py                  # 转换脚本（含价格倍数、字段映射）

load:
  type: sql                             # 目标库：SQL 写入
  connection: pg2                       # pg2 dsn.json 连接名
  table: debug.etl_test_product         # 目标表
  mode: upsert                          # upsert（重复则更新）
  key_columns: [id]                     # upsert 唯一键
  create_table: false                   # 表已存在，不自动建表
  batch_size: 50                        # 每批写入行数
